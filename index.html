<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sara &amp; Emmanuel · 5 junio 2027</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Karla:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--burgundy:#6E1423;--cream:#FBF3EA;--blush:#E4B7A0;--sage:#7D8B6A;--muted:#8A7570}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px 16px;text-align:center;color:var(--burgundy);
    font-family:"Karla",system-ui,-apple-system,sans-serif;font-weight:300;line-height:1.6;
    background:radial-gradient(ellipse at 50% 0%, rgba(228,183,160,.35), transparent 62%),var(--cream);
  }
  main{max-width:560px}
  .kicker{font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--sage)}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:clamp(42px,12vw,72px);line-height:1.02;margin:12px 0}
  h1 .amp{display:block;font-family:"Caveat",cursive;font-size:.55em;color:var(--blush)}
  .when{font-family:"Fraunces",serif;font-size:clamp(17px,4.6vw,22px);letter-spacing:.14em}
  .where{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .soon{
    margin:clamp(28px,7vw,40px) auto 0;padding-top:clamp(22px,5vw,28px);
    border-top:1px solid rgba(110,20,35,.25);width:min(320px,100%);
  }
  .soon p{font-family:"Caveat",cursive;font-size:clamp(24px,6.5vw,30px);color:var(--sage);line-height:1.25}
  .soon small{display:block;margin-top:10px;font-size:13.5px;color:var(--muted)}
  svg{display:block;width:min(220px,60%);margin:clamp(18px,5vw,26px) auto 0}
</style>
</head>
<body>
<main>
  <p class="kicker">Nos casamos<br>We're getting married</p>
  <h1>Sara<span class="amp">&amp;</span>Emmanuel</h1>
  <p class="when">5 · 06 · 2027</p>
  <p class="where">Vilasira · Venta del Moro · Valencia</p>

  <div class="soon">
    <p>Web en construcción<br>Website coming soon</p>
    <small>Guarda la fecha — pronto toda la información aquí.<br>Save the date — all the details will live here soon.</small>
  </div>

  <svg viewBox="0 0 260 22" fill="none" stroke="#E4B7A0" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
    <path d="M4 12q30-12 58 0t58 0 58 0 58 0"/><circle cx="130" cy="4" r="3" stroke="#7D8B6A"/>
  </svg>
</main>
</body>
</html>
